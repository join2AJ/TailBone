# Render blueprint for the backend (API + dashboard). New → Blueprint → pick this repo.
services:
  - type: web
    name: tailbone-api
    runtime: node
    plan: starter            # a paid plan is needed for a persistent disk
    region: singapore        # closest Render region to India
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: tailbone-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY_HOPS
        value: "2"           # Netlify proxy + Render load balancer
      - key: PROXY_SECRET
        sync: false          # random value; put the same one in netlify.toml (X-Proxy-Secret) so forged addresses can't dodge rate limits
      - key: RETENTION_YEARS
        value: "3"
      - key: SITE_URL
        sync: false          # e.g. https://tailbonetreatment.com (your Netlify domain)
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false          # 64 hex chars: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"  KEEP A COPY
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
