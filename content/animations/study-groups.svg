    <rect x="250" y="148" width="26.4" height="26" rx="5" class="a-bar a-bar--muted"><animate attributeName="width" values="0;26.4;26.4" keyTimes="0;.2;1" dur="6s" repeatCount="1" fill="freeze"/></rect>
    <text x="284.4" y="166" class="a-val">8%</text><text x="240" y="206" text-anchor="end" class="a-lbl a-lbl--left">Male bike riders</text>
