    <rect x="250" y="102" width="60.7" height="26" rx="5" class="a-bar a-bar--muted"><animate attributeName="width" values="0;60.7;60.7" keyTimes="0;.2;1" dur="6s" repeatCount="1" fill="freeze"/></rect>
