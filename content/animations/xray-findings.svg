<svg class="anim__svg" viewBox="0 0 640 312" aria-hidden="true" focusable="false">
  <text x="16" y="26" class="a-t2 a-t2--sm">What sitting and standing X-rays found (208 people with coccydynia)</text>
  <line x1="250" y1="44" x2="250" y2="296" class="a-axis"/>
  <text x="240" y="68" text-anchor="end" class="a-lbl a-lbl--left">Hypermobile coccyx</text>
  <text x="240" y="84" text-anchor="end" class="a-t3 a-t3--small">bends too far when sitting</text>
  <rect x="250" y="56" width="259.2" height="26" rx="5" class="a-bar"><animate attributeName="width" values="0;259.2;259.2" keyTimes="0;.2;1" dur="6s" repeatCount="1" fill="freeze"/></rect>
  <text x="517.2" y="74" class="a-val">27%</text>
  <text x="240" y="116" text-anchor="end" class="a-lbl a-lbl--left">Backward slip (luxation)</text>
  <text x="240" y="132" text-anchor="end" class="a-t3 a-t3--small">more common with higher weight</text>
  <rect x="250" y="104" width="211.2" height="26" rx="5" class="a-bar"><animate attributeName="width" values="0;211.2;211.2" keyTimes="0;.2;1" dur="6s" repeatCount="1" fill="freeze"/></rect>
  <text x="469.2" y="122" class="a-val">22%</text>
  <text x="240" y="164" text-anchor="end" class="a-lbl a-lbl--left">Bony spur (spicule)</text>
  <text x="240" y="180" text-anchor="end" class="a-t3 a-t3--small">more common in slimmer people</text>
  <rect x="250" y="152" width="134.4" height="26" rx="5" class="a-bar"><animate attributeName="width" values="0;134.4;134.4" keyTimes="0;.2;1" dur="6s" repeatCount="1" fill="freeze"/></rect>
  <text x="392.4" y="170" class="a-val">14%</text>
  <text x="240" y="218" text-anchor="end" class="a-lbl a-lbl--left">Forward slip (luxation)</text>
  <rect x="250" y="200" width="48.0" height="26" rx="5" class="a-bar"><animate attributeName="width" values="0;48.0;48.0" keyTimes="0;.2;1" dur="6s" repeatCount="1" fill="freeze"/></rect>
  <text x="306.0" y="218" class="a-val">5%</text>
  <text x="240" y="260" text-anchor="end" class="a-lbl a-lbl--left">Nothing abnormal seen</text>
  <text x="240" y="276" text-anchor="end" class="a-t3 a-t3--small">pain likely from soft tissue</text>
  <rect x="250" y="248" width="297.6" height="26" rx="5" class="a-bar a-bar--muted"><animate attributeName="width" values="0;297.6;297.6" keyTimes="0;.2;1" dur="6s" repeatCount="1" fill="freeze"/></rect>
  <text x="555.6" y="266" class="a-val">31%</text>
</svg>
