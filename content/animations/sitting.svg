      <circle cx="310" cy="45" r="28" class="a-body"/>
      <rect x="285" y="70" width="70" height="190" rx="34" class="a-body"/>
      <rect x="331" y="80" width="18" height="20" rx="5" class="a-bone"/>
      <rect x="331" y="104" width="18" height="20" rx="5" class="a-bone"/>
      <rect x="331" y="128" width="18" height="20" rx="5" class="a-bone"/>
      <rect x="331" y="152" width="18" height="20" rx="5" class="a-bone"/>
      <rect x="331" y="176" width="18" height="20" rx="5" class="a-bone"/>
      <rect x="331" y="200" width="18" height="20" rx="5" class="a-bone"/>
