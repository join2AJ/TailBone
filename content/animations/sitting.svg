    <rect x="175" y="262" width="30" height="78" rx="14" class="a-body"/>
    <rect x="150" y="326" width="55" height="14" rx="7" class="a-body"/>
    <rect x="175" y="246" width="150" height="34" rx="17" class="a-body"/>
