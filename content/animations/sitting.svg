    </ellipse>
    <ellipse cx="338" cy="283" rx="20" ry="5" class="a-red" opacity="0">
      <animate attributeName="opacity" values="0;.8;.8;0;0" keyTimes="0;.1;.45;.5;1" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <g>
