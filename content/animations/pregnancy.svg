        <animate attributeName="r" values="12;20;12" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="377" cy="280" r="15" class="a-green" opacity="0">
        <animate attributeName="opacity" values="0;0;.5;.5;0" keyTimes="0;.74;.78;.96;1" dur="10s" repeatCount="indefinite"/>
