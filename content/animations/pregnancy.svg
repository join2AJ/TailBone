<svg class="anim__svg" viewBox="0 0 640 420" aria-hidden="true" focusable="false">
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.33;.37;1" dur="10s" repeatCount="indefinite"/>
    <text x="320" y="32" text-anchor="middle" class="a-t1">During a vaginal delivery,</text>
    <text x="320" y="60" text-anchor="middle" class="a-t2">the baby's head pushes the coccyx backwards</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.37;.41;.62;.66;1" dur="10s" repeatCount="indefinite"/>
    <text x="320" y="32" text-anchor="middle" class="a-t1 a-t1--red">Afterwards it may stay strained</text>
    <text x="320" y="60" text-anchor="middle" class="a-t2">or out of place, so sitting and feeding hurt</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.72;.96;1" dur="10s" repeatCount="indefinite"/>
    <text x="320" y="32" text-anchor="middle" class="a-t1 a-t1--green">Gentle, hands-on treatment</text>
    <text x="320" y="60" text-anchor="middle" class="a-t2">helps restore its normal position and movement</text>
  </g>
  <g transform="translate(0 70)">
    <text x="182" y="300" class="a-t3">Front</text>
    <text x="458" y="300" class="a-t3">Back</text>
