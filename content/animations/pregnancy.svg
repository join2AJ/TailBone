      <animateMotion path="M280 10 Q300 150 338 244" keyPoints="0;1;1" keyTimes="0;.3;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="52" class="a-head"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 390 232;0 390 232;-40 390 232;-40 390 232;0 390 232;0 390 232" keyTimes="0;.2;.3;.64;.76;1" dur="10s" repeatCount="indefinite"/>
      <circle cx="377" cy="280" r="18" class="a-red" opacity="0">
