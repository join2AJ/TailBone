# Netlify serves the website from /public and forwards the API to the Node backend.
# 1. Deploy the backend (see render.yaml / README "Deploying").
# 2. Replace BACKEND_URL below with its address, e.g. https://tailbone-api.onrender.com
# Because Netlify proxies /api/* (status 200 rewrite), the browser sees one domain:
# sign-in cookies, booking and payments all work without CORS.

[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/api/*"
  to = "https://BACKEND_URL/api/:splat"
  status = 200
  force = true
  # Optional but recommended: the same random value as PROXY_SECRET on the backend, so the backend can tell real
  # visitors' addresses from forged ones (rate limits). Keep this repository private if you set it here.
  # headers = { X-Proxy-Secret = "PUT-THE-SAME-RANDOM-VALUE-HERE" }

# Articles written in the dashboard, and their pictures, audio and video, come from the backend too.
[[redirects]]
  from = "/blog/a/*"
  to = "https://BACKEND_URL/blog/a/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://BACKEND_URL/media/:splat"
  status = 200
  force = true

# Hindi pages (/hi/…), the same way.
[[redirects]]
  from = "/hi/coccydynia"
  to = "/hi/coccydynia.html"
  status = 200

[[redirects]]
